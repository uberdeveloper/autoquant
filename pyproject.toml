[project]
name = "autoquant"
version = "0.1.0"
description = "Research workspace for turning published quantitative ideas into falsifiable backtests"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
